[package]
name = "janecek_anchor"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "janecek_anchor"

[features]
default = []
test-fast = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []




[dependencies]
anchor-lang = {version = "0.31.1", features = ["init-if-needed"]}
anchor-spl = { version = "0.31.1", features = ["token_2022", "token_2022_extensions", "associated_token"] }
hook_program = { path = "../hook_program", features = ["no-entrypoint"] }
